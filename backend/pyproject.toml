[project]
name = "leftover-chef-backend"
version = "1.0.0"
description = "Leftover Chef — Smart Recipe Discovery and Ingredient Matching Platform Backend"
authors = [{ name = "Anil Biradar" }]
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0.30",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
